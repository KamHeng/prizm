spring:
  datasource:
    # LOCK_TIMEOUT gives the pessimistic row locks taken during redemption room
    # to queue under contention instead of failing fast on the 1s H2 default.
    url: jdbc:h2:mem:campaigndb;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always

server:
  port: 8080

logging:
  level:
    com.prizm.campaign: INFO
